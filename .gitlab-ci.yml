include:
  - project: dptb/drinking-ponies-ci-templates
    ref: v1.0.0
    file: dptb-ci.gitlab-ci.yml
  - local: .ansible.gitlab-ci.yml

# Canonical dptb stage order from the umbrella template, plus this service's own
# `migration` stage (liquibase) that the shared pipeline does not define.
stages:
  - pre
  - validate
  - pre-build
  - test
  - build
  - migration
  - deploy
  - post

workflow:
  rules:
    - if: '$CI_COMMIT_MESSAGE =~ /\[skip gitlab-ci\]/'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH'
      when: always
    - when: never

variables:
  GRADLE_OPTS: "-Dorg.gradle.workers.max=4 -Dorg.gradle.caching=true"
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  SERVICE_NAME: "dptb"
  SERVICE_DISPLAY_NAME: "Bot"
  YOUTRACK_PROJECT: "DPTB"

default:
  interruptible: true

lint:
  extends: .default-tags
  stage: test
  image: gradle:9.6.1-jdk17
  variables:
    GRADLE_USER_HOME: ".gradle"
  cache:
    # Keyed by the wrapper: a Gradle bump starts from a clean cache instead of
    # dragging the previous version's caches and distributions along forever.
    - key:
        files:
          - gradle/wrapper/gradle-wrapper.properties
        prefix: gradle-cache-${CI_PROJECT_ID}
      paths:
        - .gradle
  script:
    # check minus tests: picks up every verification task wired into `check`,
    # so a newly added one cannot silently stay out of CI. Tests run in the `test` job.
    - gradle check -x test

test:
  extends: .default-tags
  stage: test
  needs:
    - lint
  image: gradle:9.6.1-jdk17
  variables:
    GRADLE_USER_HOME: ".gradle"
    TELEGRAM_BOT_TOKEN: ${DPTB_TEST_TELEGRAM_BOT_TOKEN}
  cache:
    # Keyed by the wrapper: a Gradle bump starts from a clean cache instead of
    # dragging the previous version's caches and distributions along forever.
    - key:
        files:
          - gradle/wrapper/gradle-wrapper.properties
        prefix: gradle-cache-${CI_PROJECT_ID}
      paths:
        - .gradle
      policy: pull
  before_script:
    - |
      curl -fsSL https://cli.codecov.io/latest/linux/codecov -o codecov
      chmod +x codecov
  script:
    # A configuration cache entry is keyed by the requested tasks, so this job never finds the one
    # `lint` stored - and with `policy: pull` its own entry is discarded. Writing it is pure cost.
    - gradle test --no-configuration-cache

    - test -f build/jacoco/coverage.xml

    - |
      ./codecov create-commit
      ./codecov create-report
      ./codecov do-upload -Z -n "codecov-${CI_PROJECT_ID}-${CI_COMMIT_REF_NAME}"
  artifacts:
    expire_in: 1 day
    when: always
    paths:
      - build/jacoco/coverage.xml
      - build/test-results/test
    reports:
      junit: "build/test-results/test/*.xml"
      coverage_report:
        coverage_format: jacoco
        path: "build/jacoco/coverage.xml"

build-jar:
  extends: .default-tags
  stage: build
  image: gradle:9.6.1-jdk17
  needs:
    - test
    - job: validate-bump-marker
      optional: true
  variables:
    GRADLE_USER_HOME: ".gradle"
  cache:
    # Keyed by the wrapper: a Gradle bump starts from a clean cache instead of
    # dragging the previous version's caches and distributions along forever.
    - key:
        files:
          - gradle/wrapper/gradle-wrapper.properties
        prefix: gradle-cache-${CI_PROJECT_ID}
      paths:
        - .gradle
      policy: pull
  script:
    # Same reason as in the `test` job: the entry this job would write is never reused.
    - gradle assemble --no-configuration-cache
  artifacts:
    expire_in: 1 day
    paths:
      - build/libs/drinking-ponies.jar

build-image:
  extends: .default-tags
  stage: build
  image: docker:27
  needs:
    - job: generate-version
      artifacts: true
    - job: build-jar
      artifacts: true
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${CI_REGISTRY}"
  script:
    - echo "image tag=${GitVersion_SemVer}"
    - |
      docker build -t "${CI_REGISTRY_IMAGE}:${GitVersion_SemVer}" .
      docker push "${CI_REGISTRY_IMAGE}:${GitVersion_SemVer}"
      if [ "${CI_COMMIT_BRANCH}" = "master" ]; then
        docker tag "${CI_REGISTRY_IMAGE}:${GitVersion_SemVer}" "${CI_REGISTRY_IMAGE}:latest"
        docker push "${CI_REGISTRY_IMAGE}:latest"
      fi
  after_script:
    - |
      docker rmi "${CI_REGISTRY_IMAGE}:${GitVersion_SemVer}" || true
      docker rmi "${CI_REGISTRY_IMAGE}:latest" || true
