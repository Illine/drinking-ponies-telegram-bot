# Reuse the configured task graph between builds. CI shares it across jobs through the cached
# .gradle directory. Disable per-invocation with --no-configuration-cache when a plugin breaks.
org.gradle.configuration-cache=true

# kapt, KSP and the detekt alpha do not fit the Gradle defaults (512m heap, 384m metaspace):
# the daemon dies mid-build and restarts, losing the warm state and the configuration cache.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=768m
kotlin.daemon.jvmargs=-Xmx768m
